$kind: http-request
name: "[TC_API_10] Chặn Kế toán tạo Phiếu nhập kho khi chi_tiet_thuoc rỗng (400 Bad Request)"
url: "{{base_url}}/api/thuoc/phieu-nhap/"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token_ketoan}}
body:
  type: text
  content: |-
    {
      "loai_nhap": "THUOC",
      "chi_tiet_thuoc": []
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC_API_10: Chặn tạo phiếu nhập kho rỗng chi tiết (HTTP 400)', function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 3000
