$kind: http-request
url: "{{base_url}}/api/users/login/"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "ten_dang_nhap": "ketoan_test",
      "password": "Password@123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200 OK - Lấy JWT Token Kế toán', function () {
          pm.response.to.have.status(200);
          var jsonData = pm.response.json();
          var tok = jsonData.access || (jsonData.tokens && jsonData.tokens.access);
          pm.collectionVariables.set('token_ketoan', tok);
      });
    language: text/javascript
order: 4000
